name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PLUGIN_API: true

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-revision: 1.4.2+744846f84

      - name: Install the project
        run: uv sync --locked --dev

      - name: Install frontend packages
        run: bun install --cwd src/frontend

      - name: Check for lint violations
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Check django template formatting
        run: uv run djangofmt check src/coldfront

      - name: Check frontend typescript and css
        run: bun run --cwd src/frontend check

      - name: Compile and bundle frontend static assets
        run: bun run --cwd src/frontend build

      - name: Check bundled frontend static assets have been commited
        run: |
          if [[ `git status --porcelain` ]]; then
            echo "Error: pre-compiled bundled frontend static assets have not been committed"
            git status
            exit 1
          else
            echo "Bundled frontend static assets check passed."
          fi

      - name: Check licence with reuse
        run: uv run reuse lint

      - name: Check for migrations
        run: uv run coldfront makemigrations --check

      - name: Run tests
        run: COLDFRONT_ENV=.env.testing uv run -m coverage run -m pytest

      - name: Show coverage report
        run: uv run -m coverage report --skip-covered --omit '*/migrations/*,*/tests/*'
