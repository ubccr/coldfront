[project]
name = "coldfront"
version = "2.0.0"
requires-python = ">=3.12"
description = "HPC Resource Allocation System"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    'Framework :: Django',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
]
dependencies = [
    "crispy-bootstrap5>=2025.6",
    "django>6,<6.1",
    "django-cotton>=2.6.1",
    "django-crispy-forms>=2.3",
    "django-environ>=0.12.0",
    "django-filter>=25.1",
    "django-generic-notifications>=2.4.0",
    "django-htmx>=1.27.0",
    "django-jsonform>=2.23.2",
    "django-model-utils>=5.0.0",
    "django-mptt>=0.18.0",
    "django-settings-export>=1.2.1",
    "django-split-settings>=1.3.2",
    "django-tables2>=2.8.0",
    "django-taggit>=6.1.0",
    "django-viewflow>=2.2.15",
    "django-vite>=3.1.0",
    "djangorestframework>=3.16.0",
    "doi2bib>=0.4.0",
    "drf-spectacular[sidecar]>=0.29.0",
    "formencode>=2.1.1",
    "gunicorn>=23.0.0",
    "humanize>=4.12.2",
    "jsonschema>=4.26.0",
    "markdown>=3.10.2",
    "nh3>=0.3.3",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "django-rq>=2.14.1",
    "rq>=1.16.0",
    "redis>=5.2.1",
    "django-tasks-rq>=0.12.0",
    "django-tasks>=0.12.0",
    "shortuuid>=1.0.13",
    "social-auth-app-django>=5.9.0",
    "social-auth-core[saml]>=4.8.7",
    "tablib>=3.9.0",
    "habanero>=2.9.2",
    "django-money>=3.6.1",
    "fpdf2>=2.8.8",
]

[project.urls]
"Bug Tracker" = "https://github.com/coldfront/coldfront/issues"
Changelog = "https://github.com/coldfront/coldfront/blob/main/CHANGELOG.md"
Documentation = "https://docs.coldfront.dev"
"Source Code" = "https://github.com/coldfront/coldfront"

[project.scripts]
coldfront = "coldfront:manage"
gunicorn = "gunicorn.app.wsgiapp:run"

[project.optional-dependencies]
ldap = [
    "django-auth-ldap>=5.1.0",
    "ldap3>=2.9.1",
]
freeipa = [
    "dbus-python>=1.4.0",
    "ipaclient>=4.12.2",
    "setuptools==80.6.0",
    "cryptography==43.0.3",
]
mysql = [
    "mysqlclient>=2.2.7",
]
pg = [
    "psycopg2>=2.9.10",
]
initializer = [
    "coldfront-initializer",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.13.4",
    "django-sslserver>=0.22",
    "django-upgrade>=1.29.1",
    "djangofmt>=0.2.12",
    "factory-boy>=3.3.3",
    "faker>=37.1.0",
    "pytest-django>=4.11.1",
    "pytest-httpserver>=1.1.5",
    "responses>=0.26.1",
    "reuse>=5.0.2",
    "ruff>=0.11.4",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
    "pygments",
    "pymdown-extensions",
    "zensical>=0.0.52",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.2"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.pytest]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "coldfront.config.settings"
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
filterwarnings = [
    'ignore::DeprecationWarning',
]

[tool.coverage.run]
branch = true
source = ["src/coldfront/"]

[tool.uv.sources]
coldfront-initializer = { git = "https://github.com/coldfront/coldfront-initializer", branch = "main" }

[tool.djangofmt]
line-length = 120
indent-width = 4
profile = "django"
preserve-unquoted-attrs = true
html-void-self-closing = "never"
