<div class="flex flex-col gap-1">
    {% for object in results %}
        <button
            type="button"
            class="btn btn-ghost btn-sm w-full flex-col items-start justify-start text-left"
            data-label="{{ object }}"
            data-value="{{ object.pk }}"
        >
            <span class="flex w-full items-center justify-between gap-2">
                {{ object }}
                {% if object.status %}
                    <c-cf.badge variant="{{ object.get_status_color }}">{{ object.get_status_display }}</c-cf.badge>
                {% endif %}
            </span>
            {% if object.description %}
                <span class="text-sm text-muted">{{ object.description }}</span>
            {% endif %}
        </button>
    {% endfor %}
</div>
