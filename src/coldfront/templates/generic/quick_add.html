{% load i18n %}

<h2 class="text-lg font-semibold mb-4">
    {% trans "Quick Add" %} {{ model|meta:"verbose_name"|bettertitle }}
</h2>
<c-cf.form
    :form="form"
    wrapper_class=""
    hx-post="{% action_url model 'add' %}?_quickadd=True&target={{ request.GET.target }}"
    hx-target="#htmxModal-content"
    hx-disinherit="hx-select hx-swap"
>
    <c-slot name="buttons">
        <c-cf.button
            type="button"
            btnStyle="outline"
            onclick="htmxModal.close()"
            aria-label="{% trans 'Cancel' %}"
            label="{% trans 'Cancel' %}"
        />
        <c-cf.button type="submit" name="_quickadd" variant="primary" label="{% trans 'Create' %}" />
    </c-slot>
</c-cf.form>
