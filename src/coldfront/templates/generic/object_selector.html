{% load i18n %}

<div
    x-data="{
        open: {
            {% for field in form.visible_fields %}
            {{ forloop.counter }}: {% if forloop.counter < 3 or field.name in form.selector_fields %}true{% else %}false{% endif %},
            {% endfor %}
        },
    }"
>
    <h2 class="text-lg font-semibold mb-4">
        {% trans "Select" %} {{ model|meta:"verbose_name"|bettertitle }}
    </h2>
    <div class="grid grid-cols-4 gap-4">
        <div class="col-span-1">
            <div class="flex flex-col gap-1">
                {% for field in form.visible_fields %}
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input
                            type="checkbox"
                            class="toggle toggle-sm"
                            x-model="open[{{ forloop.counter }}]"
                        >
                        {{ field.label }}
                    </label>
                {% endfor %}
            </div>
        </div>
        <div class="col-span-3">
            <form
                hx-get="{% url 'htmx_object_selector' %}?_model={{ model|meta:"label_lower" }}"
                hx-target="#selector_results"
                hx-trigger="load, submit, change from:select, keyup from:#id_q delay:500ms"
            >
                <input type="hidden" name="_search" value="true">
                <div class="space-y-4">
                    {% for field in form.visible_fields %}
                        <div x-show="open[{{ forloop.counter }}]">
                            <c-cf.field :field="field" layout="stacked" />
                        </div>
                    {% endfor %}
                </div>
                <div class="flex justify-end mt-4">
                    <c-cf.button type="submit" variant="primary" label="{% trans 'Search' %}" />
                </div>
            </form>
            <div id="selector_results" class="mt-4" data-selector-target="{{ target_id }}"></div>
        </div>
    </div>
</div>
