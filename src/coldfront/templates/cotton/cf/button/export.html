{% load i18n %}

<c-cf.dropdown alignment="end">
    <c-cf.dropdown.trigger
        as="button"
        class="btn btn-info"
        aria-label='{% trans "Export" %}'
    >
        <c-cfi n="heroicon.arrow-down-tray" /> {{ label }} <c-cfi n="heroicon.chevron-down" />
    </c-cf.dropdown.trigger>
    <c-cf.dropdown.content class="border-info/50">
        <c-cf.menu class="p-1">
            <c-cf.menu.item
                id="export_current_view"
                href="?{% if url_params %}{{ url_params }}&{% endif %}export=table"
            >
                {% trans "Current View" %}
            </c-cf.menu.item>
            <c-cf.menu.item href="?{% if url_params %}{{ url_params }}&{% endif %}export">
                {% trans "All Data" %} ({{ data_format }})
            </c-cf.menu.item>
        </c-cf.menu>
    </c-cf.dropdown.content>
</c-cf.dropdown>
