{% load i18n %}
<c-vars resource />

{% if not resource.locked and perms.ras.request_allocation %}
    <c-cf.button
        as="a"
        variant="primary"
        icon="lucideicon.ticket-plus"
        href="{% url 'ras:allocation_request' %}?resource_object={{ resource.content_type.id }}:{{ resource.id }}"
    >{% trans "Request Allocation" %}</c-cf.button>
{% endif %}
