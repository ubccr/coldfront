{% load plugins %}
<c-vars left="" right="" bottom="" />
<c-cf.layout.row cols="2">
    <c-cf.layout.col>
        {{ left }}
        {% if object %}
            {% plugin_left_page object %}
        {% endif %}
    </c-cf.layout.col>
    <c-cf.layout.col>
        {{ right }}
        {% if object %}
            {% plugin_right_page object %}
        {% endif %}
    </c-cf.layout.col>
</c-cf.layout.row>
{% if bottom %}
    <c-cf.layout.row class="mt-4">
        <c-cf.layout.col>
            {{ bottom }}
        </c-cf.layout.col>
    </c-cf.layout.row>
{% endif %}
{% if object %}
    {% plugin_full_width_page object %}
{% endif %}
