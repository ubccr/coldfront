<c-vars
    link
    count
/>

{% if link %}
    <a
        href="{{ link }}"
        class="flex justify-between items-center gap-3 border-b border-base-200 px-6 py-3 hover:bg-base-200"
    >
        {{ slot }}
        {% if count %}
            <c-cf.badge variant="primary">{{ count }}</c-cf.badge>
        {% endif %}
    </a>
{% else %}
    <li class="flex justify-between items-center gap-3 border-b border-base-200 px-6 py-3">
        {{ slot }}
        {% if count %}
            <c-cf.badge variant="primary">{{ count }}</c-cf.badge>
        {% endif %}
    </li>
{% endif %}
