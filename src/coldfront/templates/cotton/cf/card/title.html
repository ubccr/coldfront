{% comment %}
DaisyUI card title — the standardized card header bar: a full-width title strip
above the body with the card-title heading.
{% endcomment %}

<c-vars class="" as="h2" />

<div class="rounded-t-[inherit] bg-base-200 border-b border-base-content/50 px-6 py-4 {{ class }}">
    <{{ as }} class="card-title">{{ slot }}</{{ as }}>
</div>
