{% load i18n %}
{% load buttons %}

<c-cf.card title='{% trans "Comments" %}'>
    <c-cf.card.body>
        {% if object.comments.count %}
            <div class="flex justify-between items-center">
                <span>{{ object.comments.count }} {% trans "comment(s)" %}</span>
            </div>
        {% else %}
            <span class="text-muted">{% trans "None" %}</span>
        {% endif %}
    </c-cf.card.body>
</c-cf.card>
