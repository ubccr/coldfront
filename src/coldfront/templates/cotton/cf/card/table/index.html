{% load i18n %}

<c-vars
    table
    actions
    model
    link
    id="object_list"
    show_paginator=True
    title=""
/>

<c-cf.card>
    {% if title %}
        <c-slot name="title">
            {{ title }}
        </c-slot>
    {% endif %}
    {% if link %}
        <div
            class="htmx-container"
            hx-get="{{ link }}"
            hx-target="this"
            hx-trigger="load"
            hx-select=".htmx-container"
            hx-swap="outerHTML"
        >
        </div>
    {% else %}
        <c-cf.table :table="table" :actions="actions" :model="model" :id="id" :show_paginator="show_paginator" />
    {% endif %}
</c-cf.card>
