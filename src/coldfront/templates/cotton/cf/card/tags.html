{% load i18n %}
<c-cf.card title='{% trans "Tags" %}'>
    <c-cf.card.body>
        {% with viewname=object|validated_viewname:"list" %}
            {% for tag in object.tags.all %}
                <c-cf.badge
                    variant="{{ tag.color }}"
                    as="a"
                    href="{% if viewname %}{% url viewname %}?tag={{ tag.slug }}{% endif %}"
                >{{ tag }}</c-cf.badge>
            {% empty %}
                <span class="text-muted">{% trans "No tags assigned" %}</span>
            {% endfor %}
        {% endwith %}
    </c-cf.card.body>
</c-cf.card>
