{% comment %}
DaisyUI table component (size, zebra, pinRows, pinCols, class). Renders a
static <table> wrapper — content is plain HTML table markup in the slot
(thead/tbody/tr/th/td). For django-tables2 objects use c-cf.dtable instead.
{% endcomment %}

<c-vars
    class=""
    size="md"
    zebra
    pinRows
    pinCols
    :sizeClasses="{
        'xs': 'table-xs',
        'sm': 'table-sm',
        'md': 'table-md',
        'lg': 'table-lg',
        'xl': 'table-xl',
    }"
/>

<div class="overflow-x-auto min-h-50">
    <table
        class="table {{ sizeClasses|get_dict_item:size }} {% if zebra %}table-zebra{% endif %} {% if pinRows %}table-pin-rows{% endif %} {% if pinCols %}table-pin-cols{% endif %} {{ class }}"
        {{ attrs }}
    >
        {{ slot }}
    </table>
</div>
