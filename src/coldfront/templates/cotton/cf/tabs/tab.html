<c-vars
    link
    href
    title=""
    badge=""
    active
    class=""
/>

{% if link %}
    <a
        href="{{ href }}"
        role="tab"
        aria-selected="{{ active|yesno:'true,false' }}"
        class="tab {{ class }} {% if active %}tab-active{% endif %} [--tab-border-color:color-mix(in_oklch,var(--color-base-content)_20%,var(--color-base-100))]"
        {{ attrs }}
    >
        {% if icon %}
            <c-cfi n="{{ icon }}" size="sm" class="me-2" />
        {% endif %}
        {% if title %}{{ title }}{% endif %}
        {% if badge %}{{ badge }}{% endif %}
    </a>
{% else %}
    <button
        type="button"
        role="tab"
        aria-selected="{{ active|yesno:'true,false' }}"
        class="tab {{ class }} {% if active %}tab-active{% endif %} [--tab-border-color:color-mix(in_oklch,var(--color-base-content)_20%,var(--color-base-100))]"
        {{ attrs }}
    >
        {% if icon %}
            <c-cfi n="{{ icon }}" size="sm" class="me-2" />
        {% endif %}
        {% if title %}{{ title }}{% endif %}
        {% if badge %}{{ badge }}{% endif %}
    </button>
{% endif %}
