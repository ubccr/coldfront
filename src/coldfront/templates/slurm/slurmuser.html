{% extends 'slurm/base.html' %}
{% load i18n %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object">
                <c-cf.card.fields.item label="{% trans 'User' %}">
                    <c-cf.badge as="a" href="{{ object.user.get_absolute_url }}">{{ object.user }}</c-cf.badge>
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Cluster' %}">
                    <c-cf.badge as="a" href="{{ object.cluster.get_absolute_url }}">{{ object.cluster }}</c-cf.badge>
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Default Account' %}">
                    {{ object.default_account|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Default WCKey' %}">
                    {{ object.default_wckey|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Default QOS' %}">
                    {{ object.default_qos|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Admin Level' %}">
                    {{ object.get_admin_level_display|placeholder }}
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.custom_fields :object="object" />
        </c-slot>
    </c-cf.layout.panels>
{% endblock %}
