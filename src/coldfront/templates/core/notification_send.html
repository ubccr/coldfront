{% extends 'generic/base.html' %}
{% load i18n %}

{% block title %}{% trans "Send Notification" %}{% endblock %}

{% block content %}
    <c-cf.form :form="form" action="." method="post">
        <c-slot name="buttons">
            <a href="{% url 'home' %}" class="btn btn-outline">{% trans "Cancel" %}</a>
            <button type="submit" name="send" class="btn btn-primary">
                {% trans "Send" %}
            </button>
        </c-slot>
    </c-cf.form>
{% endblock content %}
