{% extends base_template %}
{% load i18n %}

{% block content %}
    <c-cf.card.table :table="table" />
    {% if form %}
        <c-cf.form :form="form" action="{% url 'core:commententry_add' %}" method="post" wrapper_class="">
            <c-slot name="buttons">
                <c-cf.button
                    as="a"
                    href="{{ object.get_absolute_url }}"
                    btnStyle="outline"
                >{% trans "Cancel" %}</c-cf.button>
                <c-cf.button
                    type="submit"
                    variant="primary"
                >{% trans "Save" %}</c-cf.button>
            </c-slot>
        </c-cf.form>
    {% endif %}
{% endblock %}
