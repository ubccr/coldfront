{% extends 'generic/object_edit.html' %}
{% load i18n %}

{% block form %}
    <c-cf.form :form="form" :return_url="request.POST.return_url">
        <c-slot name="fields">
            <c-cf.form.fields :form="form" />
            <c-cf.dtable.columns-picker :form="form" />
            {% if form.changelog_message %}
                <c-cf.field :field="form.changelog_message" :form="form" />
            {% endif %}
        </c-slot>
        <c-slot name="buttons">
            <c-cf.button as="a" href="{{ return_url }}" btnStyle="outline">{% trans "Cancel" %}</c-cf.button>
            <c-cf.button type="submit" name="_update" variant="primary">
                {% trans "Save" %}
            </c-cf.button>
        </c-slot>
    </c-cf.form>
{% endblock form %}
