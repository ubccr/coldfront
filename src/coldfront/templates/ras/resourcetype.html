{% extends 'ras/base.html' %}
{% load i18n %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object" only>
                <c-cf.card.fields.item label="{% trans 'Slug' %}">
                    {{ object.slug }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Color' %}">
                    <c-cf.ui.color_label :hex="object.color" />
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Description' %}">
                    {{ object.description|placeholder }}
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" only />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.related_objects :object="object" :models="related_models" only />
            <c-cf.card.custom_fields :object="object" only />
        </c-slot>
    </c-cf.layout.panels>
{% endblock %}
