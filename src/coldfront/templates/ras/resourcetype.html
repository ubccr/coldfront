{% extends 'ras/base.html' %}
{% load i18n %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object">
                <c-cf.card.fields.item label="{% trans 'Slug' %}">
                    {{ object.slug }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Color' %}">
                    <c-cf.badge variant="{{ object.color }}">{{ object.color }}</c-cf.badge>
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Description' %}">
                    {{ object.description|placeholder }}
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.related_objects :object="object" :models="related_models" />
            <c-cf.card.custom_fields :object="object" />
        </c-slot>
    </c-cf.layout.panels>
{% endblock content %}
