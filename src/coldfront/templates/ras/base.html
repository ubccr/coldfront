{% extends 'generic/object.html' %}
{% block breadcrumbs %}
    {% if object.tenant %}
        <c-cf.breadcrumbs.item href="{{ object.tenant.get_absolute_url }}">{{ object.tenant }}</c-cf.breadcrumbs.item>
    {% elif object.project and object.project.tenant %}
        <c-cf.breadcrumbs.item
            href="{{ object.project.tenant.get_absolute_url }}"
        >{{ object.project.tenant }}</c-cf.breadcrumbs.item>
    {% endif %}
    {% if object.project %}
        <c-cf.breadcrumbs.item href="{{ object.project.get_absolute_url }}">{{ object.project }}</c-cf.breadcrumbs.item>
    {% endif %}
    {{ block.super }}
{% endblock %}
