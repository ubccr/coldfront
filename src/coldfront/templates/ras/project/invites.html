{% extends 'generic/object_children.html' %}
{% load i18n %}

{% block extra_controls %}
    {% if perms.ras.add_projectinvite %}
        <c-cf.button
            as="a"
            variant="primary"
            icon="heroicon.plus"
            href="{% url 'ras:projectinvite_add' %}?project={{ object.pk }}&return_url={% url 'ras:project_invites' pk=object.pk %}"
        >{% trans "Invite User" %}</c-cf.button>
        <c-cf.button
            as="a"
            variant="success"
            icon="heroicon.arrow-up-tray"
            href="{% url 'ras:projectinvite_bulk_import' %}?project={{ object.pk }}&return_url={% url 'ras:project_invites' pk=object.pk %}"
        >{% trans "Import Invites" %}</c-cf.button>
    {% endif %}
{% endblock extra_controls %}
