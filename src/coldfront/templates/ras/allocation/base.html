{% extends 'ras/base.html' %}

{% block breadcrumbs %}
    {% if object.tenant %}
        <c-cf.breadcrumbs.item
            href="{% url 'ras:project_list' %}?tenant_id={{ object.tenant.id }}"
        >{{ object.tenant }}</c-cf.breadcrumbs.item>
    {% elif object.project.tenant %}
        <c-cf.breadcrumbs.item
            href="{% url 'ras:project_list' %}?tenant_id={{ object.project.tenant.id }}"
        >{{ object.project.tenant }}</c-cf.breadcrumbs.item>
    {% endif %}
    <c-cf.breadcrumbs.item href="{{ object.project.get_absolute_url }}">{{ object.project }}</c-cf.breadcrumbs.item>
    <c-cf.breadcrumbs.item href="{% url 'ras:project_allocations' pk=object.project.pk %}"
    >Allocations</c-cf.breadcrumbs.item>
{% endblock %}
