{% extends 'generic/object_children.html' %}
{% load i18n %}

{% block extra_controls %}
    {% if perms.ras.add_allocationchangerequest %}
        <c-cf.button
            as="a"
            variant="primary"
            icon="lucideicon.clock-plus"
            href="{% url 'ras:allocationchangerequest_add' %}?allocation={{ object.pk }}&amp;return_url={{ request.path }}"
        >{% trans "Request Change" %}</c-cf.button>
    {% endif %}
{% endblock extra_controls %}
