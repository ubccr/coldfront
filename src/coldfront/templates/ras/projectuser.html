{% extends 'ras/base.html' %}
{% load i18n %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object">
                <c-cf.card.fields.item label="{% trans 'Username' %}">
                    {{ object.user.username }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'First Name' %}">
                    {{ object.user.first_name }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Last Name' %}">
                    {{ object.user.last_name }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Email Name' %}">
                    {{ object.user.email }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Date Added' %}">
                    {{ object.created|isodate }}
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" />
            <c-cf.card.related_objects :object="object" :models="related_models" />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.custom_fields :object="object" />
        </c-slot>
    </c-cf.layout.panels>
{% endblock content %}
