{% extends 'ras/base.html' %}
{% load i18n %}

{% block extra_controls %}
    {{ block.super }}
    <c-cf.button.request_allocation :resource="object" />
{% endblock extra_controls %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object" only>
                <c-cf.card.fields.item label="{% trans 'Resource Type' %}">
                    <c-cf.ui.badge
                        link="{{ object.resource_type.get_absolute_url }}"
                        :value="object.resource_type"
                        :color="object.resource_type.color"
                    />
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Description' %}">
                    {{ object.description|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Status' %}">
                    <c-cf.ui.badge :value="object.status" :bg_color="object.get_status_color" />
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Locked' %}">
                    <c-cf.ui.checkmark :value="object.locked" />
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" only />
            <c-cf.card.related_objects :object="object" :models="related_models" only />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.custom_fields :object="object" only />
        </c-slot>
        <c-slot name="bottom">
            <c-cf.card.schema :object="object" only />
        </c-slot>
    </c-cf.layout.panels>
{% endblock %}
