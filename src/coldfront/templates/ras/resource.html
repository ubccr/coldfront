{% extends 'ras/base.html' %}
{% load i18n %}

{% block extra_controls %}
    {{ block.super }}
    <c-cf.button.request_allocation :resource="object" />
{% endblock extra_controls %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object">
                <c-cf.card.fields.item label="{% trans 'Resource Type' %}">
                    <c-cf.badge
                        variant="{{ object.resource_type.color }}"
                        as="a"
                        href="{{ object.resource_type.get_absolute_url }}"
                    >{{ object.resource_type }}</c-cf.badge>
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Description' %}">
                    {{ object.description|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Status' %}">
                    <c-cf.badge variant="{{ object.get_status_color }}">{{ object.status }}</c-cf.badge>
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Locked' %}">
                    <c-cf.checkmark :value="object.locked" />
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" />
            <c-cf.card.related_objects :object="object" :models="related_models" />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.custom_fields :object="object" />
        </c-slot>
        <c-slot name="bottom">
            <c-cf.card.schema :object="object" />
        </c-slot>
    </c-cf.layout.panels>
{% endblock %}
