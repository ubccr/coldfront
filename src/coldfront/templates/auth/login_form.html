{% load crispy_forms_tags %}

<form method="post" action="{% url 'login' %}?next={{request.GET.next}}">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-grid gap-2">
        <c-cf.button
            type="submit"
            label="Log In"
            icon="fas fa-sign-in-alt"
            css_class="btn-primary"
        />
    </div>
</form>
