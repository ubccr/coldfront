{% load i18n %}

<form method="post" action="{% url 'login' %}?next={{request.GET.next}}">
    {% csrf_token %}
    <c-cf.form.fields :form="form" layout="stacked" />
    <c-cf.button
        type="submit"
        variant="primary"
        icon="tablericon.login"
        class="mt-4 w-full"
    >{% trans "Log In" %}</c-cf.button>
</form>
