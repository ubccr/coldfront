{% extends 'storage/base.html' %}
{% load i18n %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object" only>
                <c-cf.card.fields.item label="{% trans 'Name' %}">
                    {{ object.name }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Cluster' %}">
                    {{ object.cluster|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Interval' %}">
                    {{ object.interval }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Retention Days' %}">
                    {{ object.retention_days }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Extra Configuration' %}">
                    {{ object.extra_config|placeholder }}
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" only />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.custom_fields :object="object" only />
            <c-cf.card.related_objects :object="object" :models="related_models" only />
        </c-slot>
    </c-cf.layout.panels>
{% endblock %}
