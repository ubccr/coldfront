{% extends 'tenancy/base.html' %}
{% load i18n %}

{% block breadcrumbs %}
    {{ block.super }}
    {% if object.group %}
        <c-cf.breadcrumbs.item
            href="{% url 'tenancy:tenant_list' %}?group_id={{ object.group.pk }}"
        >{{ object.group }}</c-cf.breadcrumbs.item>
    {% endif %}
{% endblock breadcrumbs %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object">
                <c-cf.card.fields.item label="{% trans 'Group' %}">
                    {{ object.group|linkify|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Description' %}">
                    {{ object.description|placeholder }}
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.related_objects :object="object" :models="related_models" />
            <c-cf.card.custom_fields :object="object" />
        </c-slot>
    </c-cf.layout.panels>
{% endblock %}
