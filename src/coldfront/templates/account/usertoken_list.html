{% extends 'account/base.html' %}
{% load i18n %}

{% block title %}{% trans "My API Tokens" %}{% endblock %}

{% block content %}
    <c-cf.layout.row>
        <c-cf.layout.col css_class="m-3 text-end">
            <c-cf.button.add url="{% url 'account:usertoken_add' %}" label='{% trans "Add a Token" %}' />
        </c-cf.layout.col>
    </c-cf.layout.row>
    <c-cf.layout.row>
        <c-cf.layout.col>
            <c-cf.card.table :table="table" only />
        </c-cf.layout.col>
    </c-cf.layout.row>
{% endblock %}
