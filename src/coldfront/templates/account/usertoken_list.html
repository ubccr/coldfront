{% extends 'account/base.html' %}
{% load i18n %}

{% block title %}{% trans "My API Tokens" %}{% endblock %}

{% block controls %}
    <c-cf.button
        as="a"
        variant="primary"
        icon="heroicon.plus"
        href="{% url 'account:usertoken_add' %}"
    >{% trans "Add a Token" %}</c-cf.button>
{% endblock controls %}

{% block content %}
    <c-cf.layout.row>
        <c-cf.layout.col>
            <c-cf.card>
                <c-cf.dtable :table="table" />
            </c-cf.card>
        </c-cf.layout.col>
    </c-cf.layout.row>
{% endblock content %}
