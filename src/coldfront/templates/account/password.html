{% extends 'account/base.html' %}
{% load i18n %}

{% block title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
    <c-cf.form :form="form" action="." method="post">
        <c-slot name="buttons">
            <c-cf.button
                as="a"
                href="{% url 'account:profile' %}"
                icon="heroicon.x-mark"
                btnStyle="outline"
                variant="secondary"
            >{% trans "Cancel" %}</c-cf.button>
            <c-cf.button
                as="button"
                type="submit"
                icon="heroicon.check"
                variant="primary"
            >{% trans "Save" %}</c-cf.button>
        </c-slot>
    </c-cf.form>
{% endblock %}
