{% load i18n %}

<c-cf.modal id="{{ table_name }}_config" boxClass="max-w-3xl" withCloseBtn>
    <div class="flex items-center justify-between border-b border-base-200 px-6 py-4">
        <h5 id="{{ table_name }}_config_title" class="text-lg font-semibold">{% trans "Table Configuration" %}</h5>
    </div>
    <form
        class="userconfigform"
        data-url="{% url 'users-api:userconfig-list' %}"
        data-config-root="tables.{{ form.table_name }}"
    >
        <c-cf.table.columns-picker :form="form" class="p-6" />
        <div class="flex justify-end gap-2 border-t border-base-200 px-6 py-4">
            <c-cf.button
                type="submit"
                variant="error"
                btnStyle="outline"
                id="reset_tableconfig"
                value="Reset"
            >{% trans "Reset" %}</c-cf.button>
            <c-cf.button
                type="submit"
                variant="primary"
                id="save_tableconfig"
                value="Save"
            >{% trans "Save" %}</c-cf.button>
        </div>
    </form>
</c-cf.modal>
