{% extends 'generic/object_edit.html' %}
{% load i18n %}

{% block alerts %}
    {{ block.super }}
    {% if not request.user.is_superuser %}
        <c-cf.alert variant="warning" icon="heroicon.exclamation-triangle">
            Non-superusers should generally create and modify API tokens under their <a
                href="{% url 'account:usertoken_list' %}"
            >
                user profile</a>.
        </c-cf.alert>
    {% endif %}
{% endblock %}
