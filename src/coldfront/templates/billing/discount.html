{% extends 'billing/base.html' %}
{% load i18n %}

{% block content %}
    <c-cf.layout.panels>
        <c-slot name="left">
            <c-cf.card.fields :object="object">
                <c-cf.card.fields.item label="{% trans 'Owner' %}">
                    {{ object.owner|linkify }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Scope' %}">
                    {{ object.scope_object|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Type' %}">
                    {{ object.get_type_display }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Value' %}">
                    {{ object.value|placeholder }}
                </c-cf.card.fields.item>

                <c-cf.card.fields.item label="{% trans 'Description' %}">
                    {{ object.description|placeholder }}
                </c-cf.card.fields.item>
            </c-cf.card.fields>

            <c-cf.card.tags :object="object" />
        </c-slot>

        <c-slot name="right">
            <c-cf.card.custom_fields :object="object" />
            <c-cf.card.related_objects :object="object" :models="related_models" />
        </c-slot>
    </c-cf.layout.panels>
{% endblock content %}
