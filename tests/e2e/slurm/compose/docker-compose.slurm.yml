# ColdFront e2e Slurm stack
#
# The pre-built Docker Hub images are from `ubccr/slurm-docker-cluster` (which
# bakes in the cgray/sfoster/csimmons/astewart test users).
#
# `slurm.conf` is a host bind-mount override so tests can exercise config
# variants (e.g. TRESBillingWeights)
#
# Fully parameterized via a per-stack `.env` file: COMPOSE_PROJECT_NAME,
# SLURM_VERSION, SLURM_CONF, CPU_WORKER_COUNT, MYSQL_USER, MYSQL_PASSWORD,
# MYSQL_DATABASE, SSH_ENABLE.
#
# NOTE: this file intentionally references images by `${SLURM_VERSION}`

services:
  mysql:
    image: mariadb:12
    hostname: mysql
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slurm_acct_db}
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - var_lib_mysql:/var/lib/mysql
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  slurmdbd:
    image: ubccr/slurm-docker-cluster:${SLURM_VERSION}
    init: true
    command: ["slurmdbd"]
    container_name: ${COMPOSE_PROJECT_NAME}-slurmdbd
    hostname: slurmdbd
    environment:
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      ALLOW_RESTARTS: ${ALLOW_RESTARTS:-false}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    expose:
      - "6819"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmdbd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  slurmctld:
    image: ubccr/slurm-docker-cluster:${SLURM_VERSION}
    init: true
    command: ["slurmctld"]
    container_name: ${COMPOSE_PROJECT_NAME}-slurmctld
    hostname: slurmctld
    privileged: true
    working_dir: /data
    environment:
      SSH_ENABLE: ${SSH_ENABLE:-false}
    volumes:
      - etc_munge:/etc/munge:z
      - etc_slurm:/etc/slurm:z
      - slurm_jobdir:/data:z
      - var_log_slurm:/var/log/slurm:z
      # slurm.conf override (host file, read-only) — TRESBillingWeights variants
      - ${SLURM_CONF}:/etc/slurm/slurm.conf:ro
    expose:
      - "6817"
    depends_on:
      slurmdbd:
        condition: service_healthy
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  slurmrestd:
    image: ubccr/slurm-docker-cluster:${SLURM_VERSION}
    init: true
    command: ["slurmrestd"]
    container_name: ${COMPOSE_PROJECT_NAME}-slurmrestd
    hostname: slurmrestd
    privileged: true
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      # slurm.conf override (host file, read-only)
      - ${SLURM_CONF}:/etc/slurm/slurm.conf:ro
    ports:
      - "${SLURMRESTD_PORT:-6820}:6820"
    expose:
      - "6820"
    depends_on:
      slurmctld:
        condition: service_healthy
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/slurmrestd/slurmrestd.socket"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  cpu-worker:
    image: ubccr/slurm-docker-cluster:${SLURM_VERSION}
    init: true
    command: ["slurmd-cpu"]
    working_dir: /data
    privileged: true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-slurm}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      slurmctld:
        condition: service_healthy
    networks:
      - slurm-network
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: ${CPU_WORKER_COUNT:-1}

volumes:
  etc_munge:
  etc_slurm:
  slurm_jobdir:
  var_lib_mysql:
  var_log_slurm:

networks:
  slurm-network:
    driver: bridge
